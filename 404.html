<style>
  :root{--forest:#0B3D2E;--mint:#EAF6EE;--accent:#27C16F;--bone:#F3EFE3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--forest);color:var(--bone);font-family:'Manrope',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .wrap{max-width:520px;}
  h1{font-family:'Fraunces',serif;font-size:clamp(48px,10vw,96px);color:var(--accent);line-height:1;margin-bottom:12px;}
  h2{font-family:'Fraunces',serif;font-size:clamp(22px,4vw,32px);margin-bottom:16px;letter-spacing:-.02em;}
  p{color:rgba(243,239,227,.72);margin-bottom:28px;line-height:1.5;}
  a.btn{display:inline-block;background:var(--accent);color:var(--forest);font-weight:700;padding:12px 26px;border-radius:30px;text-decoration:none;font-size:14px;letter-spacing:.02em;transition:transform .2s;}
  a.btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
